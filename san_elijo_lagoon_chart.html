<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>San Elijo Lagoon — Animated Sampling Route</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: #d8f3ff;
    font-family: "Segoe UI", Arial, sans-serif;
    background: radial-gradient(circle at top, #123d63, #071827 70%);
  }
  .wrap { width: min(1100px, 100%); margin: auto; padding: 28px 18px 40px; }
  h1 { margin: 0; color: #7edbff; font-size: clamp(1.35rem, 3vw, 2rem); }
  .sub { color: #8db9ca; margin: 6px 0 18px; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    background: rgba(11, 43, 72, .8); border: 1px solid #236888;
    border-radius: 12px; padding: 12px 14px; margin-bottom: 14px;
  }
  label { color: #a9d8e8; font-size: .9rem; }
  select {
    color: #e6fbff; background: #0b2d4d; border: 1px solid #3b8eae;
    border-radius: 6px; padding: 7px 10px;
  }
  canvas { display: block; width: 100%; height: auto; background: #061522;
    border: 1px solid #236888; border-radius: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap: 10px; margin-top: 14px; }
  .card { background: rgba(15, 59, 91, .72); border: 1px solid #236888;
    border-radius: 10px; padding: 12px; }
  .label { color: #86b8c9; font-size: .72rem; letter-spacing: .08em; }
  .value { color: #7ef0ff; font-size: 1.1rem; font-weight: 600; margin-top: 4px; }
  .note { color: #91b6c5; font-size: .82rem; margin-top: 15px; }
</style>
</head>
<body>
<main class="wrap">
  <h1>San Elijo Lagoon — Animated Sampling Route</h1>
  <div class="sub" id="subtitle">Loading measurements…</div>
  <div class="toolbar">
    <label for="parameter">Color points by:</label>
    <select id="parameter">
      <option value="pH">pH</option>
      <option value="temp">Temperature (°C)</option>
      <option value="cond">Conductivity</option>
      <option value="spc">Specific Conductivity</option>
    </select>
    <span id="legend" class="note"></span>
  </div>
  <canvas id="route" width="1060" height="610"></canvas>
  <section class="cards" id="cards"></section>
  <div class="note">
    Points follow the recorded sampling order. Coordinates are plotted as longitude and latitude;
    color represents the selected measurement parameter. This page reads from measurements.csv.
  </div>
</main>
<script>
const canvas = document.getElementById("route");
const ctx = canvas.getContext("2d");
const parameter = document.getElementById("parameter");
let rows = [], current = 0, last = 0;
const labels = {pH:"pH", temp:"Temperature (°C)", cond:"Conductivity", spc:"Specific Conductivity"};

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(Boolean);
  const headers = lines.shift().split(",");
  return lines.map(line => {
    const values = line.split(",");
    const obj = {};
    headers.forEach((h, i) => obj[h] = values[i] ?? "");
    ["pH","cond","spc","temp","lat","long","depth"].forEach(k => {
      if (obj[k] !== "" && obj[k] !== "NA") obj[k] = Number(obj[k]);
    });
    return obj;
  });
}
function range(key) {
  const values = rows.map(r => Number(r[key])).filter(Number.isFinite);
  return {min: Math.min(...values), max: Math.max(...values),
    mean: values.reduce((a,b)=>a+b,0)/values.length};
}
function color(value, min, max) {
  const t = max === min ? .5 : Math.max(0, Math.min(1, (value-min)/(max-min)));
  const r = Math.round(35 + 220*t), g = Math.round(190 - 55*t), b = Math.round(245 - 30*t);
  return "rgb(" + r + "," + g + "," + b + ")";
}
function project(r, bounds) {
  const x = 72 + (r.long-bounds.minLon)/(bounds.maxLon-bounds.minLon) * (canvas.width-112);
  const y = 48 + (bounds.maxLat-r.lat)/(bounds.maxLat-bounds.minLat) * (canvas.height-100);
  return {x,y};
}
function drawGrid(bounds) {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#061522"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = "rgba(130,210,240,.12)"; ctx.lineWidth = 1;
  for (let i=0;i<=6;i++) {
    const x=72+i*(canvas.width-112)/6, y=48+i*(canvas.height-100)/6;
    ctx.beginPath(); ctx.moveTo(x,48); ctx.lineTo(x,canvas.height-52); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(72,y); ctx.lineTo(canvas.width-40,y); ctx.stroke();
  }
  ctx.strokeStyle = "rgba(130,210,240,.5)";
  ctx.beginPath(); ctx.moveTo(72,48); ctx.lineTo(72,canvas.height-52); ctx.lineTo(canvas.width-40,canvas.height-52); ctx.stroke();
  ctx.fillStyle="#91c8da"; ctx.font="12px Segoe UI";
  ctx.fillText("Latitude", 18, 30);
  ctx.fillText("Longitude", canvas.width-110, canvas.height-18);
  ctx.fillStyle="#6e9ead"; ctx.font="11px Segoe UI";
  ctx.fillText(bounds.maxLat.toFixed(5), 8, 53);
  ctx.fillText(bounds.minLat.toFixed(5), 8, canvas.height-52);
  ctx.fillText(bounds.minLon.toFixed(5), 72, canvas.height-36);
  ctx.fillText(bounds.maxLon.toFixed(5), canvas.width-115, canvas.height-36);
}
function draw() {
  if (!rows.length) return;
  const values = rows.map(r=>Number(r[parameter.value])).filter(Number.isFinite);
  const bounds = {
    minLon: Math.min(...rows.map(r=>r.long)), maxLon: Math.max(...rows.map(r=>r.long)),
    minLat: Math.min(...rows.map(r=>r.lat)), maxLat: Math.max(...rows.map(r=>r.lat))
  };
  const min=Math.min(...values), max=Math.max(...values);
  drawGrid(bounds);
  ctx.strokeStyle="rgba(126,219,255,.55)"; ctx.lineWidth=2;
  ctx.beginPath();
  rows.forEach((r,i)=>{ const p=project(r,bounds); if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y); });
  ctx.stroke();
  const visible = Math.max(1, Math.floor(current));
  rows.forEach((r,i)=>{
    if (i>=visible) return;
    const p=project(r,bounds), v=Number(r[parameter.value]);
    ctx.beginPath(); ctx.arc(p.x,p.y,i===visible-1?8:5,0,Math.PI*2);
    ctx.fillStyle=color(v,min,max); ctx.fill();
    ctx.strokeStyle=i===visible-1?"#ffffff":"#9cecff"; ctx.lineWidth=1.4; ctx.stroke();
    if(i===visible-1){ctx.fillStyle="#e5fbff";ctx.font="bold 11px Segoe UI";ctx.fillText(r.sampling_ID,p.x+10,p.y-10);}
  });
  document.getElementById("legend").textContent = labels[parameter.value] + " range: " + min.toFixed(2) + "–" + max.toFixed(2);
}
function animate(t) {
  if (!last) last=t;
  current += (t-last)*.012;
  if (current > rows.length+18) current=0;
  last=t; draw(); requestAnimationFrame(animate);
}
function updateCards() {
  const cards = document.getElementById("cards");
  const p=range("pH"), temp=range("temp"), cond=range("cond");
  cards.innerHTML = [
    ["SAMPLES", rows.length],
    ["OUTINGS", new Set(rows.map(r=>r.outing_ID)).size],
    ["DATE", rows[0]?.date?.slice(0,10) || "—"],
    ["MEAN pH", p.mean.toFixed(2)],
    ["MEAN TEMP", temp.mean.toFixed(2) + " °C"],
    ["MEAN COND.", cond.mean.toFixed(2)]
  ].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div></div>').join("");
}
fetch("san_elijo_measurements.csv")
  .then(r=>r.text()).then(text=>{
    rows=parseCSV(text);
    document.getElementById("subtitle").textContent =
      rows.length + " measurements · " + new Set(rows.map(r=>r.outing_ID)).size + " outing · source: measurements.csv";
    updateCards(); parameter.addEventListener("change", draw); requestAnimationFrame(animate);
  })
  .catch(()=>document.getElementById("subtitle").textContent="Could not load san_elijo_measurements.csv");
</script>
</body>
</html>
